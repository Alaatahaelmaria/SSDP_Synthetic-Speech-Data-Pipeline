<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SSDP · Review UI</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--border:#30363d;
  --accent:#7c3aed;--accent2:#a78bfa;--green:#22c55e;
  --red:#ef4444;--yellow:#f59e0b;--text:#e6edf3;--muted:#8b949e;
}
body{background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;min-height:100vh}
header{background:linear-gradient(135deg,#1e1b4b,#312e81);padding:1rem 2rem;display:flex;align-items:center;gap:1rem;border-bottom:1px solid var(--border)}
header h1{font-size:1.4rem;font-weight:700;color:#c4b5fd}
header span{font-size:.85rem;color:var(--muted)}
.stats{display:flex;gap:.75rem;padding:1rem 2rem;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.6rem 1.2rem;font-size:.85rem;display:flex;gap:.5rem;align-items:center}
.stat .num{font-weight:700;font-size:1.1rem}
.stat.green .num{color:var(--green)}
.stat.red .num{color:var(--red)}
.stat.yellow .num{color:var(--yellow)}
.stat.purple .num{color:var(--accent2)}
.toolbar{padding:.5rem 2rem;display:flex;gap:.5rem;flex-wrap:wrap}
.filter-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:.4rem .9rem;border-radius:20px;cursor:pointer;font-family:inherit;font-size:.82rem;transition:all .2s}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1rem;padding:1rem 2rem;padding-bottom:3rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(124,58,237,.15)}
.card.accepted{border-color:#166534}
.card.rejected{border-color:#7f1d1d}
.card-header{padding:.75rem 1rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.card-id{font-size:.72rem;color:var(--muted);font-family:monospace}
.badge{padding:.2rem .6rem;border-radius:20px;font-size:.7rem;font-weight:600}
.badge.pending{background:#2d2a1e;color:var(--yellow)}
.badge.accepted{background:#14532d;color:var(--green)}
.badge.rejected{background:#450a0a;color:var(--red)}
.badge.failed{background:#1c1c1c;color:var(--muted)}
.card-body{padding:1rem}
.arabic-text{font-size:1.05rem;line-height:1.7;color:var(--text);margin-bottom:.75rem;min-height:2.5rem}
.meta{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.75rem}
.tag{background:#21262d;border:1px solid var(--border);border-radius:6px;padding:.15rem .45rem;font-size:.7rem;color:var(--muted)}
.tag.cs{border-color:#7c3aed;color:#a78bfa}
.tag.domain{border-color:#0ea5e9;color:#7dd3fc}
audio{width:100%;height:36px;border-radius:8px;margin-bottom:.75rem}
audio::-webkit-media-controls-panel{background:#21262d}
.score-bar{height:4px;background:#21262d;border-radius:2px;margin-bottom:.75rem;overflow:hidden}
.score-fill{height:100%;border-radius:2px;transition:width .4s}
.actions{display:flex;gap:.5rem}
.btn{flex:1;padding:.5rem;border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:600;transition:all .2s}
.btn-accept{background:#14532d;color:var(--green)}
.btn-accept:hover{background:#166534}
.btn-reject{background:#450a0a;color:var(--red)}
.btn-reject:hover{background:#7f1d1d}
.btn-flag{background:#1c1a10;color:var(--yellow)}
.btn-flag:hover{background:#292524}
.pagination{display:flex;justify-content:center;gap:.5rem;padding:1rem;position:fixed;bottom:0;left:0;right:0;background:rgba(13,17,23,.9);backdrop-filter:blur(10px);border-top:1px solid var(--border)}
.page-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:.4rem .9rem;border-radius:8px;cursor:pointer;font-family:inherit}
.page-btn.active{background:var(--accent);border-color:var(--accent)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.5rem;width:min(480px,95vw)}
.modal-box h3{margin-bottom:1rem;color:var(--accent2)}
.flag-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1rem}
.flag-item{display:flex;align-items:center;gap:.5rem;font-size:.85rem;cursor:pointer}
.flag-item input{accent-color:var(--accent)}
textarea{width:100%;background:#0d1117;border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;padding:.5rem;resize:vertical;margin-bottom:1rem}
.modal-actions{display:flex;gap:.5rem;justify-content:flex-end}
.toast{position:fixed;top:1rem;right:1rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.75rem 1.2rem;font-size:.85rem;opacity:0;transition:opacity .3s;z-index:200;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div>
    <h1>🎙 SSDP · Review UI</h1>
    <span>Synthetic Speech Data Pipeline — Egyptian Arabic</span>
  </div>
</header>

<div class="stats" id="statsBar"></div>

<div class="toolbar">
  <button class="filter-btn active" onclick="setFilter('all',this)">الكل</button>
  <button class="filter-btn" onclick="setFilter('pending',this)">⏳ انتظار</button>
  <button class="filter-btn" onclick="setFilter('accepted',this)">✅ مقبول</button>
  <button class="filter-btn" onclick="setFilter('rejected',this)">❌ مرفوض</button>
</div>

<div class="grid" id="grid"></div>
<div class="pagination" id="pagination"></div>

<!-- Flag modal -->
<div class="modal" id="flagModal">
  <div class="modal-box">
    <h3>🚩 تحديد المشاكل</h3>
    <div class="flag-grid" id="flagGrid"></div>
    <textarea id="flagNote" rows="3" placeholder="ملاحظات إضافية…"></textarea>
    <div class="modal-actions">
      <button class="btn btn-reject" style="flex:none;padding:.5rem 1rem" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-accept" style="flex:none;padding:.5rem 1rem" onclick="submitReject()">تأكيد الرفض</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const FLAGS = [
  "wrong_pronunciation","english_word_issue","dialect_mismatch",
  "unnatural_speech","background_noise","clipping","too_fast","too_slow"
];
const FLAG_LABELS = {
  wrong_pronunciation:"نطق خاطئ",english_word_issue:"مشكلة كلمة إنجليزية",
  dialect_mismatch:"اللهجة غلط",unnatural_speech:"كلام غير طبيعي",
  background_noise:"ضوضاء خلفية",clipping:"تشويه صوتي",
  too_fast:"سريع جداً",too_slow:"بطيء جداً"
};

let currentFilter='all', currentPage=1, currentSampleId=null;
const PER_PAGE=20;

async function api(path,opts={}){
  const r=await fetch('/api'+path,{headers:{'Content-Type':'application/json'},...opts});
  return r.json();
}

async function loadStats(){
  const s=await api('/stats');
  document.getElementById('statsBar').innerHTML=`
    <div class="stat"><span>الكل</span><span class="num">${s.total}</span></div>
    <div class="stat yellow"><span>⏳ انتظار</span><span class="num">${s.pending}</span></div>
    <div class="stat green"><span>✅ مقبول</span><span class="num">${s.accepted}</span></div>
    <div class="stat red"><span>❌ مرفوض</span><span class="num">${s.rejected}</span></div>
  `;
}

async function loadSamples(){
  const data=await api(`/samples?status=${currentFilter}&page=${currentPage}&per_page=${PER_PAGE}`);
  renderGrid(data.samples);
  renderPagination(data.total);
}

function scoreColor(s){
  if(s>=.8)return'#22c55e';
  if(s>=.5)return'#f59e0b';
  return'#ef4444';
}

function renderGrid(samples){
  const g=document.getElementById('grid');
  if(!samples.length){g.innerHTML='<p style="color:var(--muted);padding:2rem;grid-column:1/-1;text-align:center">لا توجد عينات</p>';return;}
  g.innerHTML=samples.map(s=>{
    const cs=s.contains_code_switching?'<span class="tag cs">كود سويتشينج</span>':'';
    const score=s.quality_score??1;
    const sc=scoreColor(score);
    return`<div class="card ${s.review_status}" id="card-${s.id}">
      <div class="card-header">
        <span class="card-id">${s.id}</span>
        <span class="badge ${s.review_status}">${{pending:'⏳ انتظار',accepted:'✅ مقبول',rejected:'❌ مرفوض',failed:'⚠ فشل'}[s.review_status]||s.review_status}</span>
      </div>
      <div class="card-body">
        <div class="arabic-text">${s.text}</div>
        <div class="meta">
          <span class="tag domain">${s.domain||''}</span>
          <span class="tag">${s.style||''}</span>
          <span class="tag">${s.word_count||0} كلمة</span>
          ${s.duration_sec?`<span class="tag">${s.duration_sec}s</span>`:''}
          ${cs}
        </div>
        <div class="score-bar"><div class="score-fill" style="width:${score*100}%;background:${sc}"></div></div>
        ${s.audio_path?`<audio controls src="/api/audio/${s.id}"></audio>`:'<p style="color:var(--red);font-size:.8rem;margin-bottom:.75rem">⚠ الصوت غير متاح</p>'}
        <div class="actions">
          <button class="btn btn-accept" onclick="review('${s.id}','accepted')">✅ قبول</button>
          <button class="btn btn-flag" onclick="openModal('${s.id}')">🚩 رفض</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderPagination(total){
  const pages=Math.ceil(total/PER_PAGE);
  const p=document.getElementById('pagination');
  if(pages<=1){p.innerHTML='';return;}
  let html='';
  for(let i=1;i<=Math.min(pages,10);i++)
    html+=`<button class="page-btn${i===currentPage?' active':''}" onclick="gotoPage(${i})">${i}</button>`;
  p.innerHTML=html;
}

function gotoPage(p){currentPage=p;loadSamples();}

async function review(id,status,flags=[],note=''){
  await api('/review',{method:'POST',body:JSON.stringify({id,status,flags,note})});
  showToast(status==='accepted'?'✅ تم القبول':'❌ تم الرفض');
  loadStats();loadSamples();
}

function setFilter(f,btn){
  currentFilter=f;currentPage=1;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  loadSamples();
}

function openModal(id){
  currentSampleId=id;
  document.getElementById('flagGrid').innerHTML=FLAGS.map(f=>
    `<label class="flag-item"><input type="checkbox" value="${f}"/> ${FLAG_LABELS[f]||f}</label>`
  ).join('');
  document.getElementById('flagNote').value='';
  document.getElementById('flagModal').classList.add('open');
}
function closeModal(){document.getElementById('flagModal').classList.remove('open');}
function submitReject(){
  const flags=[...document.querySelectorAll('#flagGrid input:checked')].map(i=>i.value);
  const note=document.getElementById('flagNote').value;
  review(currentSampleId,'rejected',flags,note);
  closeModal();
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

document.getElementById('flagModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
loadStats();loadSamples();
setInterval(()=>{loadStats();},10000);
</script>
</body>
</html>
